server:
  port: 8080

spring:
  application:
    name: novel-backend

  # H2 内存数据库配置
  datasource:
    url: jdbc:h2:mem:novel_rag;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

# 日志配置
logging:
  level:
    root: INFO
    com.novel.backend: DEBUG
